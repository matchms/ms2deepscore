name: CI Build

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# Cancel previous CI runs for the same branch,
# including runs triggered by push and pull_request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  thorough_check:
    name: Thorough / Python 3.12 / Ubuntu / ${{ matrix.matchms }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        matchms:
          - "matchms>=0.19.0,<1.0"
          - "matchms>=1.0.0.dev1,<2.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Create environment and install dependencies
        run: |
          uv venv --python 3.12
          uv pip install --prerelease explicit -e ".[dev,train]" "${{ matrix.matchms }}"
          uv pip check
      - name: Show environment
        run: |
          uv run --no-sync -- python --version
          uv run --no-sync -- python -c "from importlib.metadata import version; print('matchms:', version('matchms'))"
          uv pip list
      - name: Run tests with coverage
        run: uv run --no-sync -- python -m pytest --cov --cov-report term --cov-report xml
      - name: Check style using Ruff
        if: matrix.matchms == 'matchms>=0.19.0,<1.0'
        run: uv run --no-sync -- ruff check .
      - name: SonarCloud Scan
        if: matrix.matchms == 'matchms>=0.19.0,<1.0'
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  basic_checks:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.matchms }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, macos-14]
        python-version: ["3.11", "3.12", "3.13"]
        matchms:
          - "matchms>=0.19.0,<1.0"
          - "matchms>=1.0.0.dev1,<2.0"
        exclude:
          # Covered by thorough_check with coverage on Ubuntu / Python 3.12.
          - os: ubuntu-latest
            python-version: "3.12"
            matchms: "matchms>=0.19.0,<1.0"
          - os: ubuntu-latest
            python-version: "3.12"
            matchms: "matchms>=1.0.0.dev1,<2.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Create environment and install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --prerelease explicit -e ".[dev,train]" "${{ matrix.matchms }}"
          uv pip check
      - name: Show environment
        run: |
          uv run --no-sync -- python --version
          uv run --no-sync -- python -c "from importlib.metadata import version; print('matchms:', version('matchms'))"
          uv pip list
      - name: Run tests
        run: uv run --no-sync -- python -m pytest
