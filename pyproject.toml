[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms2deepscore"
dynamic = ["version"]
description = "Deep learning similarity measure for comparing MS/MS spectra."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Florian Huber (as part of the ms2deepscore developer team)", email = "florian.huber@hs-duesseldorf.de" },
]
urls = { Homepage = "https://github.com/iomega/ms2deepscore" }
dependencies = [
    "chemap",
    "matchms>=0.19.0",
    "numba",
    "numpy>=2.0",
    "onnxscript>=0.7.0",
    "pandas<3.0",
    "scikit-learn",
    "tensorboard",
    "torch>=2.4",
    "tqdm",
    "matplotlib>=3.8.3",
]

[project.optional-dependencies]
train = ["rdkit"]
dev = [
    "bump2version",
    "isort>=4.2.5",
    "ruff",
    "pytest",
    "pytest-cov",
    "sphinx>=3.0.0,!=3.2.0,<4.0.0",
    "sphinx_rtd_theme",
    "sphinxcontrib-apidoc",
    "yapf",
    "onnxruntime>=1.27.0",
]
gpu = ["onnxruntime>=1.27.0"]
intel = ["openvino==2025.4.1", "onnxruntime-openvino"]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["ms2deepscore*"]
namespaces = false

[tool.setuptools.dynamic]
version = { attr = "ms2deepscore.__version__.__version__" }
